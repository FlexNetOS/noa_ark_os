name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  PYTHON_VERSION: '3.11'

jobs:
  # Lint and Format Checks
  lint:
    name: Lint and Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      
      - name: Python Linting
        run: |
          pip install flake8 black pylint
          # MicroAgentStack
          if [ -d repos/MicroAgentStack ]; then
            cd repos/MicroAgentStack
            flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics || true
            black --check . || true
            cd ../..
          fi
          
      - name: Rust Linting
        run: |
          # Workspace-level linting
          cargo fmt -- --check || true
          cargo clippy -- -D warnings || true

  # Python Component Tests
  test-python:
    name: Test Python Components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      
      - name: Install Dependencies and Run Tests
        run: |
          pip install pytest pytest-cov
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          fi
          if [ -d tests ]; then
            pytest tests/ -v --cov=. --cov-report=xml || true
          else
            echo "No tests directory found, skipping"
          fi
      
      - name: Upload Coverage
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false

  # Rust Component Tests
  test-rust:
    name: Test Rust Components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
      
      - name: Run Tests
        run: |
          cargo test --workspace --verbose
      
      - name: Run Benchmarks
        run: |
          if [ -d benches ]; then
            cargo bench --no-run
          fi

  # Security Scanning
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Python Security Scan
        run: |
          pip install safety bandit
          find . -name requirements.txt -exec safety check -r {} \; || true
          find . -name "*.py" -path "*/repos/*" -exec bandit -r {} \; || true
      
      - name: Rust Security Scan
        run: |
          cargo install cargo-audit || true
          cargo audit || true

  # Docker Build and Push
  docker:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: [lint, test-python, test-rust]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Build Docker Image
        if: hashFiles('Dockerfile') != ''
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Integration Tests
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test-python, test-rust]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up Docker Compose
        run: |
          docker compose version || docker-compose --version
      
      - name: Run Integration Tests
        run: |
          # Start all services if docker-compose.yml exists
          if [ -f docker-compose.yml ]; then
            docker compose up -d || docker-compose up -d
            sleep 30
            # Cleanup
            docker compose down -v || docker-compose down -v
          else
            echo "No docker-compose.yml found, skipping integration tests"
          fi

  # Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [docker, integration]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Generate Changelog
        id: changelog
        run: |
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo "")..HEAD >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          body: ${{ steps.changelog.outputs.CHANGELOG }}
          draft: false
          prerelease: false
