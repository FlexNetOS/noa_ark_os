# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: pmd

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/*.java'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/*.java'
  schedule:
    - cron: '32 16 * * 5'

permissions:
  contents: read

jobs:
  pmd-code-scan:
    permissions:
      contents: read # for actions/checkout to fetch code
      security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
      actions: read # only required for a private repository by github/codeql-action/upload-sarif to get the Action run status
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for Java files
        id: check-java
        run: |
          java_files=$(find . -name "*.java" -type f | head -1)
          if [ -n "$java_files" ]; then
            echo "found=true" >> $GITHUB_OUTPUT
            echo "source_path=$(dirname $java_files)" >> $GITHUB_OUTPUT
          else
            echo "found=false" >> $GITHUB_OUTPUT
          fi

      - name: Set up JDK 17
        if: steps.check-java.outputs.found == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Run PMD
        if: steps.check-java.outputs.found == 'true'
        id: pmd
        uses: pmd/pmd-github-action@v2
        with:
          rulesets: 'rulesets/java/quickstart.xml'
          sourcePath: ${{ steps.check-java.outputs.source_path }}
          analyzeModifiedFilesOnly: false

      - name: Upload SARIF file
        if: steps.check-java.outputs.found == 'true' && always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: pmd-report.sarif
